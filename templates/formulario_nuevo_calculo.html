<!DOCTYPE html>
<html>
<head>
</head>
<body>
    <form action="{{ url_for('pension.insertar') }}" method="POST">
        <div>
            Cédula: <input type="text" name="cedula" />
        </div>
        <div>
            Nombre: <input type="text" name="nombre" />
        </div>
        <div>
            Edad: <input type="number" name="edad" />
        </div>
        <div>
            Semanas cotizadas: <input type="number" name="semanas" />
        </div>
        <div>
            Salario promedio: <input type="number" step="0.01" name="salario" />
        </div>
        <div>
            Sexo: <input type="text" name="genero" />
        </div>
        
        <input type="submit" value="Calcular Pension" />
    </form>
    <div>
        <a href="{{ url_for('pension.index') }}">Volver al menú</a>
    </div>
</body>
</html>
